name: Keep Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          echo "Pinging backend to keep Render alive..."
          curl -f --max-time 30 https://campus-bites-apiii.onrender.com/ || echo "Ping failed, but that's okay for keep-alive"
          echo "Ping completed at $(date)"
